<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slot QA Checklist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f6f8fa;
      color: #1f2328;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1f2328;
    }

    header p {
      color: #656d76;
      font-size: 13px;
      margin-top: 4px;
    }

    .meta-row {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .meta-row input {
      flex: 1;
      min-width: 180px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      color: #1f2328;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .meta-row input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9,105,218,0.1);
    }

    .meta-row input::placeholder {
      color: #8c959f;
    }

    .category {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .category-header {
      padding: 12px 16px;
      background: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #656d76;
    }

    .category-score {
      font-size: 12px;
      color: #8c959f;
    }

    .test-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #eaeef2;
      gap: 12px;
      transition: background 0.1s;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .test-item:hover {
      background: #f6f8fa;
    }

    .test-label {
      flex: 1;
      font-size: 14px;
      color: #1f2328;
      cursor: pointer;
      user-select: none;
    }

    .test-label.passed {
      color: #1a7f37;
    }

    .test-label.failed {
      color: #cf222e;
      text-decoration: line-through;
    }

    .test-label.skipped {
      color: #9a6700;
      font-style: italic;
      opacity: 0.7;
    }

    .btn-group {
      display: flex;
      gap: 4px;
    }

    .btn-status {
      width: 32px;
      height: 28px;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      opacity: 0.45;
      color: #1f2328;
    }

    .btn-status:hover {
      opacity: 0.8;
      background: #eaeef2;
    }

    .btn-status.active {
      opacity: 1;
    }

    .btn-status.pass.active {
      background: #dafbe1;
      border-color: #1a7f37;
      color: #1a7f37;
    }

    .btn-status.fail.active {
      background: #ffebe9;
      border-color: #cf222e;
      color: #cf222e;
    }

    .btn-status.skip.active {
      background: #fff8c5;
      border-color: #9a6700;
      color: #9a6700;
    }

    .progress-bar {
      background: #eaeef2;
      border-radius: 4px;
      height: 4px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #1a7f37;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
      font-size: 13px;
    }

    .stat { color: #656d76; }
    .stat span { font-weight: 600; }
    .stat.pass span { color: #1a7f37; }
    .stat.fail span { color: #cf222e; }
    .stat.skip span { color: #9a6700; }
    .stat.total span { color: #0969da; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .btn-copy {
      background: #1f883d;
      border-color: #1a7f37;
      color: #fff;
    }

    .btn-copy:hover {
      background: #1a7f37;
    }

    .btn-copy.copied {
      background: #dafbe1;
      border-color: #1a7f37;
      color: #1a7f37;
    }

    .btn-reset {
      background: #ffffff;
      border-color: #d0d7de;
      color: #656d76;
    }

    .btn-reset:hover {
      border-color: #8c959f;
      color: #1f2328;
      background: #f6f8fa;
    }

    .preview {
      margin-top: 24px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .preview.visible { display: block; }

    .preview-header {
      padding: 10px 16px;
      background: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      font-size: 12px;
      color: #656d76;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview pre {
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #1f2328;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1f883d;
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Slot QA Checklist</h1>
    <p>Mark each test, then copy results to Jira.</p>
  </header>

  <div class="meta-row">
    <input type="text" id="gameName" placeholder="Game name (e.g. Lucky Joker 100)" />
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="stats">
    <div class="stat total">Total: <span id="statTotal">0</span></div>
    <div class="stat pass">✅ Passed: <span id="statPass">0</span></div>
    <div class="stat fail">❌ Failed: <span id="statFail">0</span></div>
    <div class="stat skip">⏭ Skipped: <span id="statSkip">0</span></div>
  </div>

  <div id="checklist"></div>

  <div class="actions" style="margin-top: 24px;">
    <button class="btn btn-copy" id="btnCopy">Copy for Jira</button>
    <button class="btn btn-reset" id="btnReset">Reset all</button>
  </div>

  <div class="preview" id="preview">
    <div class="preview-header">
      <span>Jira comment preview</span>
      <span id="previewClose" style="cursor:pointer;color:#58a6ff;">hide</span>
    </div>
    <pre id="previewContent"></pre>
  </div>

</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const LS_KEY = 'slot-qa-state';

let TESTS = [];
const state = {};
const allTests = [];

function initTests(tests) {
  TESTS = tests;
  tests.forEach((cat, ci) => {
    cat.tests.forEach((label, ti) => {
      const id = `${ci}-${ti}`;
      state[id] = null;
      allTests.push({ id, category: cat.category, label });
    });
  });
}

function saveToStorage() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    state,
    gameName: document.getElementById('gameName').value,
  }));
}

function loadFromStorage() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY));
    if (!saved) return;
    if (saved.gameName) document.getElementById('gameName').value = saved.gameName;
    // only restore keys that still exist in current test list
    Object.keys(saved.state).forEach(k => {
      if (k in state) state[k] = saved.state[k];
    });
  } catch (e) { /* ignore corrupt data */ }
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const list = document.getElementById('checklist');
  list.innerHTML = '';

  TESTS.forEach((cat, ci) => {
    const catEl = document.createElement('div');
    catEl.className = 'category';

    const passed = cat.tests.filter((_, ti) => state[`${ci}-${ti}`] === 'pass').length;
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <span class="category-title">${cat.category}</span>
      <span class="category-score">${passed}/${cat.tests.length}</span>
    `;
    catEl.appendChild(header);

    cat.tests.forEach((label, ti) => {
      const id = `${ci}-${ti}`;
      const status = state[id];

      const item = document.createElement('div');
      item.className = 'test-item';

      const lbl = document.createElement('span');
      lbl.className = 'test-label' + (status === 'pass' ? ' passed' : status === 'fail' ? ' failed' : status === 'skip' ? ' skipped' : '');
      lbl.textContent = label;

      const btnGroup = document.createElement('div');
      btnGroup.className = 'btn-group';

      ['pass', 'fail', 'skip'].forEach(s => {
        const btn = document.createElement('button');
        btn.className = `btn-status ${s}${status === s ? ' active' : ''}`;
        btn.title = s.charAt(0).toUpperCase() + s.slice(1);
        btn.textContent = s === 'pass' ? '✓' : s === 'fail' ? '✗' : '–';
        btn.onclick = () => {
          // toggle off if already active
          state[id] = state[id] === s ? null : s;
          render();
          updateStats();
          saveToStorage();
        };
        btnGroup.appendChild(btn);
      });

      item.appendChild(lbl);
      item.appendChild(btnGroup);
      catEl.appendChild(item);
    });

    list.appendChild(catEl);
  });
}

function updateStats() {
  const values = Object.values(state);
  const pass = values.filter(v => v === 'pass').length;
  const fail = values.filter(v => v === 'fail').length;
  const skip = values.filter(v => v === 'skip').length;
  const total = pass + fail + skip;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statSkip').textContent = skip;

  const pct = allTests.length > 0 ? (total / allTests.length) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ─── Jira wiki markup output ─────────────────────────────────────────────────
function buildJiraMarkup() {
  const game = document.getElementById('gameName').value.trim() || '—';
  const date = new Date().toLocaleDateString('en-GB');

  const values = Object.values(state);
  const pass = values.filter(v => v === 'pass').length;
  const fail = values.filter(v => v === 'fail').length;
  const skip = values.filter(v => v === 'skip').length;
  const total = allTests.length;

  let out = `*QA Acceptance Test* — ${game}\n`;
  out += `Date: ${date}\n`;
  out += `Result: *${pass}/${total} passed*`;
  if (fail > 0) out += ` | ❌ ${fail} failed`;
  if (skip > 0) out += ` | ⏭ ${skip} skipped`;
  out += '\n\n';

  TESTS.forEach((cat, ci) => {
    out += `*${cat.category}*\n`;
    cat.tests.forEach((label, ti) => {
      const s = state[`${ci}-${ti}`];
      const icon = s === 'pass' ? '(/)' : s === 'fail' ? '(x)' : s === 'skip' ? '(!)' : '( )';
      out += `${icon} ${label}\n`;
    });
    out += '\n';
  });

  return out.trim();
}

// ─── Actions ─────────────────────────────────────────────────────────────────
document.getElementById('btnCopy').addEventListener('click', () => {
  const markup = buildJiraMarkup();

  // Show preview
  const preview = document.getElementById('preview');
  document.getElementById('previewContent').textContent = markup;
  preview.classList.add('visible');

  navigator.clipboard.writeText(markup).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy for Jira';
      btn.classList.remove('copied');
    }, 2000);

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('Reset all test results?')) return;
  Object.keys(state).forEach(k => state[k] = null);
  document.getElementById('gameName').value = '';
  render();
  updateStats();
  saveToStorage();
  document.getElementById('preview').classList.remove('visible');
});

document.getElementById('previewClose').addEventListener('click', () => {
  document.getElementById('preview').classList.remove('visible');
});

// ─── Init ─────────────────────────────────────────────────────────────────────
fetch('tests.json')
  .then(r => r.json())
  .then(tests => {
    initTests(tests);
    loadFromStorage();
    render();
    updateStats();
  });

// persist game name on input
document.getElementById('gameName').addEventListener('input', saveToStorage);
</script>
</body>
</html>
