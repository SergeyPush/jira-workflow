<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slot QA Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-subtle: #f9fafb;
      --border: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.04);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.04);
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 16px 64px;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header { margin-bottom: 28px; }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 3px;
    }

    /* ── Game input ── */
    .meta-row {
      margin-bottom: 20px;
    }

    .meta-row input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .meta-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(79 70 229 / 0.12);
    }

    .meta-row input::placeholder { color: var(--text-muted); }

    /* ── Progress ── */
    .progress-wrap {
      margin-bottom: 20px;
    }

    .progress-bar {
      background: var(--border);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      border-radius: 99px;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Stats ── */
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }

    .stat span { font-weight: 600; }
    .stat.pass { background: var(--green-bg); border-color: #bbf7d0; color: var(--green); }
    .stat.fail { background: var(--red-bg); border-color: #fecaca; color: var(--red); }
    .stat.skip { background: var(--amber-bg); border-color: #fde68a; color: var(--amber); }
    .stat.total { color: var(--accent); border-color: #c7d2fe; background: #eef2ff; }

    /* ── Category card ── */
    .category {
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .category-header {
      padding: 10px 16px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-secondary);
    }

    .category-score {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--border);
      padding: 2px 7px;
      border-radius: 99px;
    }

    /* ── Test row ── */
    .test-item {
      display: flex;
      align-items: center;
      padding: 11px 16px;
      border-bottom: 1px solid #f3f4f6;
      gap: 12px;
      transition: background 0.1s;
    }

    .test-item:last-child { border-bottom: none; }
    .test-item:hover { background: var(--surface-subtle); }

    .test-label {
      flex: 1;
      font-size: 15px;
      color: var(--text-primary);
      user-select: none;
      transition: color 0.15s;
    }

    .test-label.passed { color: var(--green); font-weight: 500; }
    .test-label.failed { color: var(--red); text-decoration: line-through; opacity: 0.75; }
    .test-label.skipped { color: var(--amber); font-style: italic; opacity: 0.8; }

    /* ── Status buttons ── */
    .btn-group { display: flex; gap: 6px; }

    .btn-status {
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
      color: var(--text-muted);
    }

    .btn-status:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

    .btn-status.pass.active  { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .btn-status.fail.active  { background: var(--red-bg);   border-color: var(--red);   color: var(--red);   }
    .btn-status.skip.active  { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }

    /* ── Action buttons ── */
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }

    .btn {
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.15s;
    }

    .btn-copy {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 1px 3px rgb(79 70 229 / 0.3);
    }

    .btn-copy:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-copy.copied {
      background: var(--green-bg);
      border-color: var(--green);
      color: var(--green);
      box-shadow: none;
    }

    .btn-reset {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }

    .btn-reset:hover { border-color: var(--text-muted); color: var(--text-primary); }

    /* ── Preview ── */
    .preview {
      margin-top: 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
      box-shadow: var(--shadow);
    }

    .preview.visible { display: block; }

    .preview-header {
      padding: 10px 16px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-header a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }

    .preview pre {
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 24px;
      background: #1f2937;
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
      box-shadow: var(--shadow-md);
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Slot QA Checklist</h1>
    <p>Mark each test, then copy results to Jira.</p>
  </header>

  <div class="meta-row">
    <input type="text" id="gameName" placeholder="Game name (e.g. Lucky Joker 100)" />
  </div>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat total">Reviewed: <span id="statTotal">0</span> / <span id="statAllTotal">0</span></div>
    <div class="stat pass">Passed: <span id="statPass">0</span></div>
    <div class="stat fail">Failed: <span id="statFail">0</span></div>
    <div class="stat skip">Skipped: <span id="statSkip">0</span></div>
  </div>

  <div id="checklist"></div>

  <div class="actions" style="margin-top: 24px;">
    <button class="btn btn-copy" id="btnCopy">Copy for Jira</button>
    <button class="btn btn-reset" id="btnReset">Reset all</button>
  </div>

  <div class="preview" id="preview">
    <div class="preview-header">
      <span>Jira comment preview</span>
      <a id="previewClose">hide</a>
    </div>
    <pre id="previewContent"></pre>
  </div>

</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const LS_KEY = 'slot-qa-state';

let TESTS = [];
const state = {};
const allTests = [];

function initTests(tests) {
  TESTS = tests;
  tests.forEach((cat, ci) => {
    cat.tests.forEach((label, ti) => {
      const id = `${ci}-${ti}`;
      state[id] = null;
      allTests.push({ id, category: cat.category, label });
    });
  });
}

function saveToStorage() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    state,
    gameName: document.getElementById('gameName').value,
  }));
}

function loadFromStorage() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY));
    if (!saved) return;
    if (saved.gameName) document.getElementById('gameName').value = saved.gameName;
    // only restore keys that still exist in current test list
    Object.keys(saved.state).forEach(k => {
      if (k in state) state[k] = saved.state[k];
    });
  } catch (e) { /* ignore corrupt data */ }
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const list = document.getElementById('checklist');
  list.innerHTML = '';

  TESTS.forEach((cat, ci) => {
    const catEl = document.createElement('div');
    catEl.className = 'category';

    const passed = cat.tests.filter((_, ti) => state[`${ci}-${ti}`] === 'pass').length;
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <span class="category-title">${cat.category}</span>
      <span class="category-score">${passed}/${cat.tests.length}</span>
    `;
    catEl.appendChild(header);

    cat.tests.forEach((label, ti) => {
      const id = `${ci}-${ti}`;
      const status = state[id];

      const item = document.createElement('div');
      item.className = 'test-item';

      const lbl = document.createElement('span');
      lbl.className = 'test-label' + (status === 'pass' ? ' passed' : status === 'fail' ? ' failed' : status === 'skip' ? ' skipped' : '');
      lbl.textContent = label;

      const btnGroup = document.createElement('div');
      btnGroup.className = 'btn-group';

      ['pass', 'fail', 'skip'].forEach(s => {
        const btn = document.createElement('button');
        btn.className = `btn-status ${s}${status === s ? ' active' : ''}`;
        btn.title = s.charAt(0).toUpperCase() + s.slice(1);
        btn.textContent = s === 'pass' ? '✓' : s === 'fail' ? '✗' : '–';
        btn.onclick = () => {
          // toggle off if already active
          state[id] = state[id] === s ? null : s;
          render();
          updateStats();
          saveToStorage();
        };
        btnGroup.appendChild(btn);
      });

      item.appendChild(lbl);
      item.appendChild(btnGroup);
      catEl.appendChild(item);
    });

    list.appendChild(catEl);
  });
}

function updateStats() {
  const values = Object.values(state);
  const pass = values.filter(v => v === 'pass').length;
  const fail = values.filter(v => v === 'fail').length;
  const skip = values.filter(v => v === 'skip').length;
  const total = pass + fail + skip;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAllTotal').textContent = allTests.length;
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statSkip').textContent = skip;

  const pct = allTests.length > 0 ? (total / allTests.length) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ─── Jira wiki markup output ─────────────────────────────────────────────────
function buildJiraMarkup() {
  const game = document.getElementById('gameName').value.trim() || '—';
  const date = new Date().toLocaleDateString('en-GB');

  const values = Object.values(state);
  const pass = values.filter(v => v === 'pass').length;
  const fail = values.filter(v => v === 'fail').length;
  const skip = values.filter(v => v === 'skip').length;
  const total = allTests.length;

  let out = `*QA Acceptance Test* — ${game}\n`;
  out += `Date: ${date}\n`;
  out += `Result: *${pass}/${total} passed*`;
  if (fail > 0) out += ` | ❌ ${fail} failed`;
  if (skip > 0) out += ` | ⏭ ${skip} skipped`;
  out += '\n\n';

  TESTS.forEach((cat, ci) => {
    out += `*${cat.category}*\n`;
    cat.tests.forEach((label, ti) => {
      const s = state[`${ci}-${ti}`];
      const icon = s === 'pass' ? '(/)' : s === 'fail' ? '(x)' : s === 'skip' ? '(!)' : '( )';
      out += `${icon} ${label}\n`;
    });
    out += '\n';
  });

  return out.trim();
}

// ─── Actions ─────────────────────────────────────────────────────────────────
document.getElementById('btnCopy').addEventListener('click', () => {
  const markup = buildJiraMarkup();

  // Show preview
  const preview = document.getElementById('preview');
  document.getElementById('previewContent').textContent = markup;
  preview.classList.add('visible');

  navigator.clipboard.writeText(markup).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy for Jira';
      btn.classList.remove('copied');
    }, 2000);

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('Reset all test results?')) return;
  Object.keys(state).forEach(k => state[k] = null);
  document.getElementById('gameName').value = '';
  render();
  updateStats();
  saveToStorage();
  document.getElementById('preview').classList.remove('visible');
});

document.getElementById('previewClose').addEventListener('click', () => {
  document.getElementById('preview').classList.remove('visible');
});

// ─── Init ─────────────────────────────────────────────────────────────────────
fetch('tests.json')
  .then(r => r.json())
  .then(tests => {
    initTests(tests);
    loadFromStorage();
    render();
    updateStats();
  });

// persist game name on input
document.getElementById('gameName').addEventListener('input', saveToStorage);
</script>
</body>
</html>
